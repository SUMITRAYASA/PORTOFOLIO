    <header>

    <main class="bg-background w-full flex flex-col-reverse gap-6  px-6 py-6 text-base lg:flex-row lg:px-[180px] lg:py-[40px] text-second-primary font-semibold lg:relative">
        <section class="priview-card w-full lg:w-[800px] h-fit px-6 lg:px-[32px] py-8 flex lg:py-[32px] flex flex-col gap-6 bg-white border rounded-lg lg:sticky lg:top-6">
            <header class="w-full text-center">
                <h2 class="text-2xl font-semibold">Priview</h2>
                <p class="font-medium">Pantau dan pelajari cara perhitungan disini</p>
            </header>
            <div class="content flex flex-col gap-6">
                <div class="preview flex flex-col lg:flex-row bg-bg-primary-transparant rounded-lg px-2 py-4">
                    <div class="bangun lg:flex-2">
                        <img src="asset/bangun-ruang/balok.png" alt="">
                    </div>
                    <div class="preview-desc lg:flex-1 flex lg:flex-col justify-between lg:justify-center lg:gap-2 px-5 lg:px-1">
                        <p id="panjang" class="keterangan-bangun-ruang">
                            p = -
                        </p>
                        <p id="lebar" class="keterangan-bangun-ruang">
                            l = -
                        </p>
                        <p id="tinggi" class="keterangan-bangun-ruang">
                            t = -
                        </p>
                    </div>
                </div>
                <div class="proses flex flex-col gap-4">
                    <div class="rumus flex flex-col text-second-primary font-semibold gap-2">
                        <header class="">Perhitungan</header>
                        <div class="rumus-content flex w-full px-3 py-3 bg-bg-primary-transparant rounded-sm">
                            <p id="rumus" >(L = 2 x (p x l + p x t + l x t)).</p>
                        </div>
                    </div>
                    <div class="perhitungan font-semibold flex flex-col text-second-primary gap-2">
                        <header class="">Perhitungan</header>
                        <div class="perhitungan-content flex w-full px-3 py-3 bg-bg-primary-transparant rounded-sm">
                            <p id="perhitungan">L= -</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="hasil font-semibold flex flex-col items-center text-white gap-2 px-3 py-5 bg-primary rounded-sm">
                <p id="identitas-luas" class="text-sm font-medium">Hasil luas balok</p>
                <output class="flex gap-1 items-end">
                    <h3 id="hasil" class="text-4xl">100</h3>
                    <p id="ukuran">cm</p>
                </output>
            </div>
        </section>

                            <div class="balok w-8/8 aspect-square">

                <div class="inputs flex flex-col gap-3">
